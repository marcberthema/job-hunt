<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Search Reports</title>
  <style>
    :root {
      color-scheme: light dark;
      --nav-bg: #101828;
      --nav-text: #d0d5dd;
      --nav-hover: #344054;
      --active: #1570ef;
      --border: #344054;
      --page-bg: #f2f4f7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 10px 14px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgb(0 0 0 / 18%);
    }

    .brand {
      flex: 0 0 auto;
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex: 1 1 auto;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }

    button {
      flex: 0 0 auto;
      appearance: none;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 7px 11px;
      background: transparent;
      color: var(--nav-text);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    button:hover {
      color: #fff;
      background: var(--nav-hover);
    }

    button:focus-visible {
      outline: 3px solid rgb(132 202 255 / 55%);
      outline-offset: 1px;
    }

    button[aria-current="page"] {
      color: #fff;
      background: var(--active);
      border-color: #53b1fd;
    }

    main {
      min-height: 0;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 700px) {
      header {
        display: block;
        padding: 9px 10px 7px;
      }

      .brand {
        display: block;
        margin: 0 2px 7px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Job Search Reports</div>
    <nav aria-label="Job site reports" id="report-nav"></nav>
  </header>
  <main>
    <iframe id="report-frame" title="Job search report"></iframe>
  </main>

  <script>
    const reports = [
      ["Built In", "builtin-job-search.html"],
      ["Dice", "dice-job-search.html"],
      ["Eluta", "eluta-job-search.html"],
      ["Indeed", "indeed-job-search.html"],
      ["Job Bank", "jobbank-job-search.html"],
      ["LinkedIn", "linkedin-job-search.html"],
      ["Randstad", "randstad-job-search.html"],
      ["RemoteOK", "remoteok-job-search.html"],
      ["S.i. Systems", "sisystems-job-search.html"]
    ];

    const nav = document.querySelector("#report-nav");
    const frame = document.querySelector("#report-frame");
    const buttons = new Map();

    function reportFromHash() {
      const requested = decodeURIComponent(location.hash.slice(1));
      return reports.find(([, file]) => file === requested) || reports[0];
    }

    function loadReport(report, updateHash = true) {
      const [label, file] = report;
      frame.src = file;
      frame.title = `${label} job search report`;
      document.title = `${label} | Job Search Reports`;

      for (const [buttonFile, button] of buttons) {
        if (buttonFile === file) {
          button.setAttribute("aria-current", "page");
          button.scrollIntoView({ block: "nearest", inline: "nearest" });
        } else {
          button.removeAttribute("aria-current");
        }
      }

      if (updateHash && location.hash !== `#${file}`) {
        history.pushState(null, "", `#${file}`);
      }
    }

    for (const report of reports) {
      const [label, file] = report;
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", () => loadReport(report));
      buttons.set(file, button);
      nav.append(button);
    }

    window.addEventListener("hashchange", () => loadReport(reportFromHash(), false));
    loadReport(reportFromHash(), false);
  </script>
</body>
</html>
